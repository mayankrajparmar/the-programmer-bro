name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, format and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Design tokens are up to date
        run: npm run tokens:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  e2e:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # Production keeps the full site behind the launch switch and hides drafts, so it builds
      # different pages: build it and check only the coming-soon page shows.
      - name: Build as production
        run: npm run build
        env:
          VERCEL_ENV: production
      - name: Browser tests on the production build
        run: npm run test:e2e:production
      - name: Build as a preview
        run: npm run build
        env:
          # The News page shows sample stories (e2e/fixtures/news.json) instead of the database.
          NEWS_FIXTURES: "1"
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
